name: Tests

on:
    push:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout worst-commute-finder
              uses: actions/checkout@v4
              with:
                  path: worst-commute-finder

            - name: Checkout chicago-traffic
              uses: actions/checkout@v4
              with:
                  repository: LukasAnell/chicago-traffic
                  path: chicago-traffic

            - name: Install uv
              uses: astral-sh/setup-uv@v3
              with:
                  python-version: "3.14"

            - name: Install dependencies
              working-directory: worst-commute-finder
              run: uv sync

            - name: Run tests
              working-directory: worst-commute-finder
              run: uv run pytest
