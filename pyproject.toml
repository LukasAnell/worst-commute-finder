[project]
name = "worst-commute-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LukasAnell", email = "lukasmanell@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chicago-traffic",
]

[project.scripts]
worst-commute-finder = "worst_commute_finder:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
chicago-traffic = { path = "../chicago-traffic", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
